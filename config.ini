[Run]
; 生成/校验用的通用参数，不含任何学校信息
exclude_points = []
min_distance = 2.5
allow_overflow_distance = 0.1
single_mileage_min_offset = 0.5
single_mileage_max_offset = -0.5
cadence_min_offset = 30
cadence_max_offset = -150
split_count = 10
min_consume = 4.50
max_consume = 5.50
strides = 0.8

[Login]
; 不填也能跑（用 [User] 里的 token）；填了 start.bat 可以自动登录
username =
password =
