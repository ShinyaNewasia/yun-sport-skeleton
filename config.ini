; =====================================================================
;  云运动 打卡脚本 · 配置（骨架版：不含任何学校 / 账号 / 轨迹数据）
;
;  换一所学校：只改 [Yun] 里下面这 5 项，其余一律不用动
;      school_host       学校接口地址
;      school_id         学校 ID
;      school_name       学校名（只用于显示）
;      school_login_url  登录接口名
;      app_edition       手机上 App 的版本号
;  换账号：重跑一次登录（start.bat 或 tools/Login.py），[User] 段会自动写回。
;  注意：值后面不要跟注释（configparser 不会剥掉行内注释）。
; =====================================================================

[Yun]
; 数据服务域名（脚本自身使用，一般不用改）
yun_host = https://sports.yzhiee.com:8085

; ---------------- 换学校只改这 5 项 ----------------
; 学校接口地址，例：https://xxx.yourschool.example:8000
school_host =
; 学校 ID，例：201（不知道就用 tools/getUrl_Id.py 按学校名查目录）
school_id =
; 学校名，只用于界面显示
school_name =
; 登录接口名，各校不同（常见 appLogin / appLoginXXX），务必抓包确认
school_login_url =
; 客户端版本号，和你手机上 App 的一致，例：3.6.7
app_edition =

; ---------------- 协议常量：App 级参数，全校通用，不用改 ----------------
; 换学校、换账号都不需要动这里；它们出自公开的 App 客户端（上游仓库同样是这几行）。
publickey = BDdKFsuBf51UObke1pEgfER17biBg/5r8slqE4s8oOa8lVesWgIUxsRc+AmZ72GcuJ56f7avnyJe3CJY4n00LU4=
privatekey = P3s0+rMuY4Nt5cUWuOCjMhDzVNdom+W0RvdV6ngM+/E=
cipherkeyencrypted = BGfbsG9EkXz5KeCva8E0MisBeS6bhBEDId3VXeIuBoiBMZU0Mosv7PqKsvqxZ3PjkUlsjzh09Se629SWW45XP4TIUeXoLpYzgk5fAMbg0VNVnXuLH9xVzdHAeM+1qJrgvwwkwio85/DnrP1aArvVQrw3N4xd5tugqQ==
